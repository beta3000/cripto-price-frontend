<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertidor de Criptomonedas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo">PREEV</div>
            <h1 class="title">Convertidor de Criptomonedas</h1>
            <div class="theme-controls">
                <button class="theme-btn" id="darkModeBtn" aria-label="Modo oscuro">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/>
                    </svg>
                </button>
                <button class="theme-btn" id="settingsBtn" aria-label="Configuración">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"/>
                    </svg>
                </button>
                <button class="theme-btn" id="infoBtn" aria-label="Información">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Main Converter -->
        <main class="converter">
            <div class="converter-row">
                <div class="input-group">
                    <input type="number" id="amountFrom" class="amount-input" value="1" min="0" step="any">
                </div>

                <div class="select-group">
                    <select id="cryptoFrom" class="crypto-select">
                        <option value="bitcoin" data-symbol="BTC">BTC</option>
                        <option value="ethereum" data-symbol="ETH">ETH</option>
                        <option value="binancecoin" data-symbol="BNB">BNB</option>
                        <option value="cardano" data-symbol="ADA">ADA</option>
                        <option value="solana" data-symbol="SOL">SOL</option>
                        <option value="ripple" data-symbol="XRP">XRP</option>
                        <option value="polkadot" data-symbol="DOT">DOT</option>
                        <option value="dogecoin" data-symbol="DOGE">DOGE</option>
                        <option value="avalanche-2" data-symbol="AVAX">AVAX</option>
                        <option value="polygon" data-symbol="MATIC">MATIC</option>
                        <option value="litecoin" data-symbol="LTC">LTC</option>
                        <option value="chainlink" data-symbol="LINK">LINK</option>
                    </select>
                </div>

                <div class="equals-sign">=</div>

                <div class="result-group">
                    <div id="amountTo" class="amount-result">0</div>
                </div>

                <div class="select-group">
                    <select id="currencyTo" class="crypto-select">
                        <option value="usd" data-symbol="USD">USD</option>
                        <option value="eur" data-symbol="EUR">EUR</option>
                        <option value="gbp" data-symbol="GBP">GBP</option>
                        <option value="jpy" data-symbol="JPY">JPY</option>
                        <option value="cad" data-symbol="CAD">CAD</option>
                        <option value="aud" data-symbol="AUD">AUD</option>
                        <option value="chf" data-symbol="CHF">CHF</option>
                        <option value="btc" data-symbol="BTC">BTC</option>
                        <option value="eth" data-symbol="ETH">ETH</option>
                    </select>
                </div>
            </div>

            <!-- Swap Button and Update Info -->
            <div class="converter-footer">
                <button class="swap-btn" id="swapBtn" aria-label="Intercambiar monedas">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M8 5a1 1 0 100 2h5.586l-1.293 1.293a1 1 0 001.414 1.414l3-3a1 1 0 000-1.414l-3-3a1 1 0 10-1.414 1.414L13.586 5H8zM12 15a1 1 0 100-2H6.414l1.293-1.293a1 1 0 10-1.414-1.414l-3 3a1 1 0 000 1.414l3 3a1 1 0 001.414-1.414L6.414 15H12z"/>
                    </svg>
                </button>
                <div class="update-info">
                    <span id="lastUpdate">Actualizando...</span>
                    <span class="update-dot" id="updateDot"></span>
                </div>
            </div>
        </main>

        <!-- Crypto Cards Grid -->
        <section class="crypto-grid" id="cryptoGrid">
            <!-- Cards will be generated dynamically -->
        </section>

        <!-- Footer -->
        <footer class="footer">
            <p>Datos proporcionados por <a href="https://www.coingecko.com/" target="_blank" rel="noopener">CoinGecko API</a></p>
            <p>Actualización automática cada 30 segundos</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
